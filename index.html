<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M's Hot Cocoa Recs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
  :root{
    --cream:#F3E9D6;
    --paper:#FBF5EA;
    --espresso:#3E2A20;
    --brick:#A9502F;
    --sage:#7C8A5C;
    --gold:#C9962E;
    --ink:#4A372B;
    --line: rgba(62,42,32,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--cream);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(62,42,32,0.06) 1px, transparent 0);
    background-size: 18px 18px;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding: 28px 20px 60px;
  }

  .wrap{ max-width: 980px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:16px;
    margin-bottom: 26px;
    border-bottom: 2px dashed var(--line);
    padding-bottom: 18px;
  }
  .title-block{ display:flex; align-items:center; gap:14px; }
  .cup-mark{ width:46px; height:46px; flex-shrink:0; }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 2.1rem;
    margin:0;
    color:var(--espresso);
    line-height:1;
  }
  .sub{
    font-family:'Caveat', cursive;
    font-size:1.25rem;
    color:var(--brick);
    margin-top:2px;
    display:block;
  }

  .view-toggle{
    display:flex; background:var(--paper); border:1.5px solid var(--espresso);
    border-radius:999px; padding:4px; gap:4px;
  }
  .view-toggle button{
    border:none; background:transparent; padding:8px 18px;
    font-family:'Work Sans', sans-serif; font-weight:600; font-size:0.9rem;
    color:var(--ink); border-radius:999px; cursor:pointer;
    transition: background .2s, color .2s;
  }
  .view-toggle button.active{ background:var(--espresso); color:var(--paper); }

  .add-btn{
    font-family:'Work Sans', sans-serif; font-weight:600; font-size:0.9rem;
    background:var(--brick); color:#fff; border:none; border-radius:999px;
    padding:10px 20px; cursor:pointer; box-shadow: 0 3px 0 rgba(62,42,32,0.35);
    transition: transform .15s, box-shadow .15s;
  }
