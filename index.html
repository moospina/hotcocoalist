<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M's Hot Cocoa Recs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --cream:#F3E9D6;
    --paper:#FBF5EA;
    --espresso:#3E2A20;
    --brick:#A9502F;
    --sage:#7C8A5C;
    --gold:#C9962E;
    --ink:#4A372B;
    --line: rgba(62,42,32,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--cream);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(62,42,32,0.06) 1px, transparent 0);
    background-size: 18px 18px;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding: 28px 20px 60px;
  }

  .wrap{ max-width: 980px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:16px;
    margin-bottom: 26px;
    border-bottom: 2px dashed var(--line);
    padding-bottom: 18px;
  }
  .title-block{ display:flex; align-items:center; gap:14px; }
  .cup-mark{ width:46px; height:46px; flex-shrink:0; }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 2.1rem;
    margin:0;
    color:var(--espresso);
    line-height:1;
  }
  .sub{
    font-family:'Caveat', cursive;
    font-size:1.25rem;
    color:var(--brick);
    margin-top:2px;
    display:block;
  }

  .view-toggle{
    display:flex; background:var(--paper); border:1.5px solid var(--espresso);
    border-radius:999px; padding:4px; gap:4px;
  }
  .view-toggle button{
    border:none; background:transparent; padding:8px 18px;
    font-family:'Work Sans', sans-serif; font-weight:600; font-size:0.9rem;
    color:var(--ink); border-radius:999px; cursor:pointer;
    transition: background .2s, color .2s;
  }
  .view-toggle button.active{ background:var(--espresso); color:var(--paper); }

  .add-btn{
    font-family:'Work Sans', sans-serif; font-weight:600; font-size:0.9rem;
    background:var(--brick); color:#fff; border:none; border-radius:999px;
    padding:10px 20px; cursor:pointer; box-shadow: 0 3px 0 rgba(62,42,32,0.35);
    transition: transform .15s, box-shadow .15s;
  }
  .add-btn:hover{ transform: translateY(-1px); }
  .add-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 rgba(62,42,32,0.35); }

  .toolbar{ display:flex; }

  .search-row{
    display:flex; justify-content:center; align-items:center;
    gap:10px; flex-wrap:wrap; margin-bottom:22px;
  }
  .search-row select{
    border:1.5px solid var(--line); border-radius:999px; padding:9px 14px;
    font-family:'Work Sans', sans-serif; font-size:0.88rem; background:#fff; color:var(--ink);
    cursor:pointer;
  }
  .search-row select:focus{ outline:none; border-color:var(--brick); }

  .card.dragging{ opacity:0.4; }
  .card .drag-handle{
    position:absolute; top:10px; left:10px; color:var(--line); font-size:0.95rem;
    cursor:grab; opacity:0.6; user-select:none;
  }
  .card .drag-handle:hover{ opacity:1; color:var(--sage); }

  /* ---------- Rating legend ---------- */
  .legend-card{
    background:var(--paper); border:1.5px solid var(--line); border-radius:4px;
    padding: 16px 18px; margin-bottom: 22px; position:relative;
    display:flex; flex-direction:column; align-items:flex-start; gap:8px;
    width: 190px;
    transform: rotate(-1.8deg);
    box-shadow: 3px 4px 10px rgba(62,42,32,0.15);
  }
  .legend-card .tape{ top:-10px; }
  .legend-title{
    font-family:'Fraunces', serif; font-weight:600; font-size:0.9rem; color:var(--espresso);
    margin-right:0;
  }
  .legend-scale{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--ink); opacity:0.85; }
  .legend-item .beans svg{ width:13px; height:15px; }
  .legend-item .beans{ margin-bottom:0; }

  .notes-row{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:22px; justify-content:center; }
  .notes-row .legend-card{ margin-bottom:0; }
  .fave-card{
    background: #F6E2C8; border:1.5px solid var(--line); border-radius:4px;
    padding: 16px 18px; position:relative;
    width: 190px;
    transform: rotate(2deg);
    box-shadow: 3px 4px 10px rgba(62,42,32,0.15);
    text-align:center;
  }
  .fave-card .tape{ top:-10px; background: rgba(122,138,92,0.55); }
  .fave-title{
    font-family:'Caveat', cursive; font-weight:700; font-size:1.1rem; color:var(--brick);
    display:block; margin-bottom:4px; text-align:center;
  }
  .fave-name{
    font-family:'Fraunces', serif; font-weight:600; font-size:1rem; color:var(--espresso);
    margin-bottom:4px; line-height:1.2;
  }
  .fave-loc{ font-size:0.78rem; color:var(--brick); font-weight:600; margin-bottom:6px; }

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center; padding: 60px 20px; color: var(--ink); opacity:0.8;
  }
  .empty .cup-mark{ width:64px; height:64px; margin: 0 auto 12px; display:block; }
  .empty h3{ font-family:'Fraunces', serif; font-size:1.4rem; margin: 0 0 6px; color:var(--espresso); }

  /* ---------- List view ---------- */
  #listView{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr));
    gap: 22px;
  }
  .card{
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius: 10px;
    padding: 18px 18px 16px;
    position:relative;
    box-shadow: 0 3px 8px rgba(62,42,32,0.08);
  }
  .tape{
    position:absolute; top:-10px; left:50%; transform:translateX(-50%) rotate(-2deg);
    width:70px; height:22px; background: rgba(201,150,46,0.55);
    border:1px solid rgba(62,42,32,0.15);
  }
  .card h3{
    font-family:'Fraunces', serif; font-size:1.2rem; margin: 6px 0 2px; color:var(--espresso);
  }
  .card .loc{
    font-size:0.85rem; color:var(--brick); font-weight:600; margin-bottom:8px;
    display:flex; align-items:center; gap:4px;
  }
  .beans{ display:flex; gap:4px; margin-bottom:10px; }
  .beans svg{ width:14px; height:16px; }
  .card .notes{
    font-size:0.92rem; line-height:1.45; color:var(--ink); margin:0;
    white-space:pre-wrap;
  }
  .card .del{
    position:absolute; top:10px; right:10px; background:none; border:none;
    color: var(--line); cursor:pointer; font-size:0.85rem; opacity:0.5;
  }
  .card .del:hover{ opacity:1; color:var(--brick); }
  .card .edit{
    position:absolute; top:10px; right:32px; background:none; border:none;
    color: var(--line); cursor:pointer; font-size:0.9rem; opacity:0.5;
  }
  .card .edit:hover{ opacity:1; color:var(--sage); }

  /* ---------- Map view ---------- */
  #mapView{ display:none; }
  .map-frame{
    position:relative; width:100%; aspect-ratio: 16/10; background:var(--paper);
    border:1.5px solid var(--espresso); border-radius:14px; overflow:hidden;
    box-shadow: 0 4px 12px rgba(62,42,32,0.12);
  }
  #worldMap{ width:100%; height:100%; background:var(--cream); }
  #worldMap .leaflet-tile-pane{
    filter: sepia(0.55) saturate(1.15) hue-rotate(-15deg) brightness(0.88) contrast(1.05);
  }
  #worldMap .leaflet-control-zoom a{
    background:var(--paper); color:var(--espresso); border-color:var(--line) !important;
  }
  .cocoa-pin{ width:32px; height:32px; }
  .cocoa-pin svg{ width:100%; height:100%; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
  .leaflet-popup-content-wrapper{
    background:var(--paper); color:var(--ink); border-radius:10px;
    font-family:'Work Sans', sans-serif;
  }
  .leaflet-popup-content{ margin:12px 14px; }
  .popup-name{ font-family:'Fraunces', serif; font-weight:700; color:var(--espresso); font-size:1.02rem; margin-bottom:2px; }
  .popup-loc{ font-size:0.8rem; color:var(--brick); font-weight:600; margin-bottom:6px; }
  .popup-notes{ font-size:0.85rem; line-height:1.4; margin-top:6px; }
  .leaflet-popup-tip{ background:var(--paper); }

  .map-hint{
    font-family:'Caveat', cursive; font-size:1.1rem; color:var(--brick);
    text-align:center; margin: 10px 0 0;
  }

  /* ---------- Modal / form ---------- */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(62,42,32,0.45);
    align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--paper); border-radius:14px; padding:26px 26px 22px;
    max-width: 480px; width:100%; max-height:90vh; overflow-y:auto;
    border:1.5px solid var(--espresso);
  }
  .modal h2{
    font-family:'Fraunces', serif; color:var(--espresso); margin:0 0 4px; font-size:1.4rem;
  }
  .modal .hint{ font-size:0.85rem; color:var(--ink); opacity:0.75; margin: 0 0 16px; }
  label{ display:block; font-weight:600; font-size:0.85rem; margin: 14px 0 5px; color:var(--espresso); }
  input[type=text], textarea{
    width:100%; border:1.5px solid var(--line); border-radius:8px; padding:9px 11px;
    font-family:'Work Sans', sans-serif; font-size:0.92rem; background:#fff; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:70px; }
  .rate-row{ display:flex; gap:6px; }
  .rate-row button{
    background:none; border:none; cursor:pointer; padding:2px;
  }
  .rate-row svg{ width:20px; height:23px; }

  .mini-map{
    position:relative; width:100%; aspect-ratio: 16/9; border:1.5px dashed var(--line);
    border-radius:10px; overflow:hidden; margin-top:6px; display:none;
  }
  #previewMap{ width:100%; height:100%; }
  #previewMap .leaflet-tile-pane{
    filter: sepia(0.55) saturate(1.15) hue-rotate(-15deg) brightness(0.88) contrast(1.05);
  }
  .locate-row{ display:flex; gap:8px; margin-top:8px; }
  .locate-row input{ flex:1; }
  .btn-locate{
    background:var(--sage); color:#fff; border:none; border-radius:8px;
    padding:0 16px; font-weight:600; font-size:0.85rem; cursor:pointer; white-space:nowrap;
  }
  .btn-locate:disabled{ opacity:0.5; cursor:not-allowed; }
  .locate-status{ font-size:0.82rem; margin-top:6px; color:var(--ink); opacity:0.8; }
  .locate-status.ok{ color:var(--sage); opacity:1; font-weight:600; }
  .locate-status.err{ color:var(--brick); opacity:1; font-weight:600; }

  .modal-actions{
    display:flex; justify-content:flex-end; gap:10px; margin-top:20px;
  }
  .btn-secondary{
    background:none; border:1.5px solid var(--line); color:var(--ink);
    padding:9px 16px; border-radius:999px; cursor:pointer; font-weight:600; font-size:0.88rem;
  }
  .btn-primary{
    background:var(--espresso); color:var(--paper); border:none;
    padding:9px 18px; border-radius:999px; cursor:pointer; font-weight:600; font-size:0.88rem;
  }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .form-msg{ font-size:0.82rem; color:var(--brick); margin-top:8px; min-height:1em; }

  @media (max-width:560px){
    h1{ font-size:1.6rem; }
    .view-toggle button{ padding:7px 12px; font-size:0.82rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <svg class="cup-mark" viewBox="0 0 64 64" fill="none">
        <path d="M32 8c10 4 16 14 16 24 0 12-8 22-16 24-8-2-16-12-16-24 0-10 6-20 16-24z" fill="#A9502F" stroke="#3E2A20" stroke-width="2.5"/>
        <path d="M32 10v44" stroke="#3E2A20" stroke-width="2"/>
        <path d="M32 16c-4 3-6 6-6 10M32 16c4 3 6 6 6 10M32 30c-4 3-6 6-6 10M32 30c4 3 6 6 6 10" stroke="#7a3d24" stroke-width="1.6" fill="none"/>
      </svg>
      <div>
        <h1>M's Hot Cocoa Recs</h1>
        <span class="sub">oh, my breath smells like chocolate</span>
      </div>
    </div>
  </header>

  <div class="notes-row">
    <div class="legend-card">
      <div class="tape"></div>
      <span class="legend-title">Rating Guide</span>
      <div class="legend-scale" id="legendScale"></div>
    </div>

    <div class="fave-card">
      <div class="tape"></div>
      <span class="fave-title">my fav spot</span>
      <div class="fave-name">L.A. Burdick Handmade Chocolates</div>
      <div class="fave-loc">📍 Chicago, IL</div>
    </div>
  </div>

  <div style="display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap;">
    <div class="view-toggle">
      <button id="btnList" class="active">List</button>
      <button id="btnMap">Map</button>
    </div>
    <div class="toolbar" id="toolbar" style="display:none;">
      <button class="add-btn" id="openAdd">+ Add a spot</button>
    </div>
  </div>

  <div class="search-row">
    <select id="sortSelect">
      <option value="rating-desc">Sort: Highest rated</option>
      <option value="rating-asc">Sort: Lowest rated</option>
      <option value="name-asc">Sort: Name A–Z</option>
    </select>
    <select id="locationSelect">
      <option value="">All locations</option>
    </select>
  </div>

  <div id="loading" style="text-align:center; padding:40px; opacity:0.6;">Warming up the list…</div>
  <div id="loadError" style="display:none; text-align:center; padding:20px; color:var(--brick); font-weight:600;"></div>

  <div id="listView"></div>

  <div id="mapView">
    <div class="map-frame">
      <div id="worldMap"></div>
    </div>
    <p class="map-hint">tap a pin to peek at the notes 🍫</p>
  </div>


</div>

<!-- Add spot modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Add a hot cocoa spot</h2>
    <p class="hint">Enter a name and location, then tap Locate to find it on the map.</p>

    <label>Name</label>
    <input type="text" id="fName" placeholder="e.g. The Cocoa House">

    <label>Location</label>
    <div class="locate-row">
      <input type="text" id="fLoc" placeholder="e.g. Chicago, IL or a full address">
      <button type="button" class="btn-locate" id="btnLocate">Locate</button>
    </div>
    <div class="locate-status" id="locateStatus"></div>
    <div class="mini-map" id="miniMap">
      <div id="previewMap"></div>
    </div>

    <label>Rating</label>
    <div class="rate-row" id="rateRow"></div>

    <label>Notes</label>
    <textarea id="fNotes" placeholder="what makes it good, what to order..."></textarea>

    <label>Passcode</label>
    <input type="password" id="fPass" placeholder="enter passcode to save">

    <div class="form-msg" id="formMsg"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelAdd">Cancel</button>
      <button class="btn-primary" id="saveAdd">Save spot</button>
      <!-- label text is swapped between "Save spot" / "Save changes" by JS depending on add vs edit mode -->
    </div>
  </div>
</div>

<!-- Delete spot modal -->
<div class="overlay" id="deleteOverlay">
  <div class="modal">
    <h2>Remove this spot?</h2>
    <p class="hint" id="deleteSpotName"></p>
    <label>Passcode</label>
    <input type="password" id="delPass" placeholder="enter passcode to remove">
    <div class="form-msg" id="deleteMsg"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelDelete">Cancel</button>
      <button class="btn-primary" id="confirmDelete">Remove spot</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   SETUP REQUIRED — read this before deploying
   ---------------------------------------------------------------------
   This site stores its shared list of cocoa spots in a free Supabase
   project (a small hosted Postgres database with a REST API). Before
   this will work:

   1. Create a free project at https://supabase.com
   2. In the SQL Editor, run the statements from schema.sql (provided
      alongside this file) to create the `spots` table.
   3. In Project Settings > API, copy your "Project URL" and
      "anon public" key and paste them into the two constants below.

   Note on security: the passcode below is just a friendly gate in the
   page itself, not a server-enforced permission — anyone who inspects
   the page source (or the anon key) could technically call the
   database directly. That matches the original design and is fine for
   a low-stakes personal recommendations page, but don't use this
   pattern for anything sensitive.
===================================================================== */
const SUPABASE_URL = "https://xaaxhgiahyxkzrptvvgi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhYXhoZ2lhaHl4a3pycHR2dmdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzUxMzgsImV4cCI6MjEwMjc1MTEzOH0.ZJXdvfHk_kYmKUKJ5qaIV5xXu9aLL_IeTHOa8f9REj8";

// The "+ Add a spot" button and the edit/delete icons on each card are hidden
// from regular visitors. Only someone who loads the page with ?manage=1 in
// the URL sees them (you can bookmark that link for yourself). This is on
// top of the passcode, not instead of it.
const MANAGE_MODE = new URLSearchParams(window.location.search).get('manage') === '1';
if(MANAGE_MODE){
  document.getElementById('toolbar').style.display = 'flex';
}

function supabaseHeaders(extra){
  return Object.assign({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  }, extra || {});
}

const BEAN_SVG = (filled) => `
  <svg viewBox="0 0 24 26" fill="none">
    <path d="M4 7
      C4.5 5.2 5.5 3.5 8 4
      C9 2.2 11 4.3 12 2.5
      C13 4.3 15 2.2 16 4
      C18.5 3.5 19.5 5.2 20 7
      L20 19
      C20 23 16.5 25 12 25
      C7.5 25 4 23 4 19
      Z"
      fill="#FBF5EA" stroke="${filled ? '#3E2A20' : 'rgba(62,42,32,0.35)'}" stroke-width="1.5" stroke-linejoin="round"/>
    ${filled ? '<path d="M5 8c1.5 1 3 1.4 7 1.4s5.5-0.4 7-1.4" stroke="#3E2A20" stroke-width="0.9" fill="none" opacity="0.35"/>' : ''}
  </svg>`;

const PIN_SVG = `
  <svg viewBox="0 0 64 64" fill="none">
    <path d="M32 8c10 4 16 14 16 24 0 12-8 22-16 24-8-2-16-12-16-24 0-10 6-20 16-24z" fill="#A9502F" stroke="#3E2A20" stroke-width="2.5"/>
    <path d="M32 10v44" stroke="#3E2A20" stroke-width="2"/>
    <path d="M32 16c-4 3-6 6-6 10M32 16c4 3 6 6 6 10M32 30c-4 3-6 6-6 10M32 30c4 3 6 6 6 10" stroke="#7a3d24" stroke-width="1.6" fill="none"/>
  </svg>`;

const cocoaIcon = L.divIcon({
  className: 'cocoa-pin',
  html: PIN_SVG,
  iconSize: [32, 32],
  iconAnchor: [16, 16],
  popupAnchor: [0, -18]
});

function buildLegend(){
  const legendScale = document.getElementById('legendScale');
  const labels = ['fine', 'good', 'great', 'excellent', 'perfect'];
  legendScale.innerHTML = labels.map((label, i) => {
    const n = i + 1;
    let beans = '';
    for(let j=1;j<=n;j++){
      beans += `<span style="width:13px;height:15px;display:inline-block;">${BEAN_SVG(true)}</span>`;
    }
    return `<div class="legend-item"><div class="beans">${beans}</div><span>= ${label}</span></div>`;
  }).join('');
}
buildLegend();

let spots = [];
let currentRating = 0;
let pendingPin = null; // {lat, lng, label}
let editingId = null; // null = adding a new spot, otherwise the id of the spot being edited

const listView = document.getElementById('listView');
const mapView = document.getElementById('mapView');
const sortSelect = document.getElementById('sortSelect');
const locationSelect = document.getElementById('locationSelect');
const loadingEl = document.getElementById('loading');
const loadErrorEl = document.getElementById('loadError');

// Regular visitors only get Highest rated / Lowest rated / Name A-Z. In manage
// mode, an extra "My order" choice is added so you can see (and drag to
// rearrange) the manually-set order — public visitors never see this option.
if(MANAGE_MODE){
  const myOrderOpt = document.createElement('option');
  myOrderOpt.value = 'default';
  myOrderOpt.textContent = 'Sort: My order (drag to arrange)';
  sortSelect.insertBefore(myOrderOpt, sortSelect.firstChild);
  sortSelect.value = 'default';
}

// Main world map
const worldMap = L.map('worldMap', { scrollWheelZoom: true }).setView([20, 0], 2);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
  maxZoom: 18,
  subdomains: 'abcd'
}).addTo(worldMap);
let markerLayer = L.layerGroup().addTo(worldMap);

// Preview map (in add-spot modal)
let previewMap = null;
let previewMarker = null;
function ensurePreviewMap(){
  if(previewMap) return;
  previewMap = L.map('previewMap', { zoomControl:true, scrollWheelZoom:false }).setView([20,0], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    maxZoom: 18,
    subdomains: 'abcd'
  }).addTo(previewMap);
}

// Turns Nominatim's structured address into a short "City, ST" / "City, Country"
// label, e.g. "Chicago, IL", "Los Angeles, CA", "London, UK".
const COUNTRY_ABBREV_OVERRIDES = { gb: 'UK', us: 'US' };
function buildShortLocationLabel(address){
  if(!address) return null;
  const city = address.city || address.town || address.village || address.hamlet ||
    address.municipality || address.county;
  const countryCode = (address.country_code || '').toLowerCase();
  let region = null;

  if(countryCode === 'us' || countryCode === 'ca'){
    // Nominatim includes a field like "US-IL" or "CA-ON" with addressdetails=1
    const iso = address['ISO3166-2-lvl4'];
    if(iso && iso.includes('-')) region = iso.split('-')[1];
    else if(address.state) region = address.state;
  } else if(countryCode){
    region = COUNTRY_ABBREV_OVERRIDES[countryCode] || countryCode.toUpperCase();
  }

  if(city && region) return `${city}, ${region}`;
  if(city) return city;
  return address.country || null;
}

// Geocoding via OpenStreetMap's free Nominatim service (no account/key needed).
// Please be a good citizen of the free service: don't hammer it with rapid
// requests. See https://operations.osmfoundation.org/policies/nominatim/
async function geocodeLocation(query){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&q=' + encodeURIComponent(query);
  const response = await fetch(url, { headers: { 'Accept-Language': 'en' } });
  if(!response.ok) throw new Error('Location lookup failed.');
  const results = await response.json();
  if(!results || !results.length) throw new Error('Could not find that location.');
  const best = results[0];
  const shortLabel = buildShortLocationLabel(best.address) ||
    best.display_name.split(',').slice(0, 3).join(',').trim();
  return { lat: parseFloat(best.lat), lng: parseFloat(best.lon), label: shortLabel || query };
}

function renderBeans(rating, size=14){
  let html = '<div class="beans">';
  for(let i=1;i<=5;i++){
    html += `<span style="width:${size}px;height:${Math.round(size*1.1)}px;display:inline-block;">${BEAN_SVG(i<=rating)}</span>`;
  }
  return html + '</div>';
}

function getFilteredSpots(){
  const loc = locationSelect ? locationSelect.value : '';
  const sortMode = sortSelect ? sortSelect.value : 'rating-desc';

  let result = spots.filter(s => !loc || s.location === loc);

  if(sortMode === 'rating-desc'){
    result = result.slice().sort((a,b) => (b.rating||0) - (a.rating||0));
  } else if(sortMode === 'rating-asc'){
    result = result.slice().sort((a,b) => (a.rating||0) - (b.rating||0));
  } else if(sortMode === 'name-asc'){
    result = result.slice().sort((a,b) => (a.name||'').localeCompare(b.name||''));
  }
  // 'default' (manage mode only) keeps the manually-arranged server order

  return result;
}

function populateLocationFilter(){
  if(!locationSelect) return;
  const current = locationSelect.value;
  const uniqueLocations = Array.from(new Set(spots.map(s => s.location).filter(Boolean))).sort();
  locationSelect.innerHTML = '<option value="">All locations</option>' +
    uniqueLocations.map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
  if(uniqueLocations.includes(current)) locationSelect.value = current;
}

let dragSourceId = null;

function renderList(){
  populateLocationFilter();
  const visible = getFilteredSpots();
  const dragEnabled = MANAGE_MODE && sortSelect && sortSelect.value === 'default' && !(locationSelect && locationSelect.value);

  if(spots.length === 0){
    listView.innerHTML = `<div class="empty" style="grid-column:1/-1;">
      <svg class="cup-mark" viewBox="0 0 64 64" fill="none">
        <path d="M32 8c10 4 16 14 16 24 0 12-8 22-16 24-8-2-16-12-16-24 0-10 6-20 16-24z" fill="#A9502F" stroke="#3E2A20" stroke-width="2.5"/>
        <path d="M32 10v44" stroke="#3E2A20" stroke-width="2"/>
        <path d="M32 16c-4 3-6 6-6 10M32 16c4 3 6 6 6 10M32 30c-4 3-6 6-6 10M32 30c4 3 6 6 6 10" stroke="#7a3d24" stroke-width="1.6" fill="none"/>
      </svg>
      <h3>No spots yet</h3>
      <p>Add the first one to start your trail.</p>
    </div>`;
    return;
  }

  if(visible.length === 0){
    listView.innerHTML = `<div class="empty" style="grid-column:1/-1;">
      <h3>No matches</h3>
      <p>Try a different search term.</p>
    </div>`;
    return;
  }

  listView.innerHTML = visible.map(s => `
    <div class="card" data-id="${s.id}" ${dragEnabled ? 'draggable="true"' : ''}>
      <div class="tape"></div>
      ${MANAGE_MODE ? `${dragEnabled ? '<span class="drag-handle" title="Drag to reorder">⠿</span>' : ''}
      <button class="edit" data-id="${s.id}" title="Edit">✎</button>
      <button class="del" data-id="${s.id}" title="Remove">✕</button>` : ''}
      <h3>${escapeHtml(s.name)}</h3>
      <div class="loc">📍 ${escapeHtml(s.location)}</div>
      ${renderBeans(s.rating)}
      <p class="notes">${escapeHtml(s.notes || '')}</p>
    </div>
  `).join('');
  listView.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', () => openDeleteModal(btn.dataset.id));
  });
  listView.querySelectorAll('.edit').forEach(btn=>{
    btn.addEventListener('click', () => openEditModal(btn.dataset.id));
  });

  if(dragEnabled){
    listView.querySelectorAll('.card').forEach(card => {
      card.addEventListener('dragstart', () => {
        dragSourceId = card.dataset.id;
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dragSourceId = null;
      });
      card.addEventListener('dragover', (e) => {
        e.preventDefault();
      });
      card.addEventListener('drop', (e) => {
        e.preventDefault();
        const targetId = card.dataset.id;
        if(dragSourceId && targetId && dragSourceId !== targetId){
          reorderSpots(dragSourceId, targetId);
        }
      });
    });
  }
}

function reorderSpots(draggedId, targetId){
  const fromIndex = spots.findIndex(s => s.id === draggedId);
  if(fromIndex === -1) return;
  const [moved] = spots.splice(fromIndex, 1);
  let toIndex = spots.findIndex(s => s.id === targetId);
  if(toIndex === -1) toIndex = spots.length;
  spots.splice(toIndex, 0, moved);
  renderList();
  renderMap();
  persistOrder();
}

async function persistOrder(){
  const snapshot = spots.map((s, i) => ({ id: s.id, sort_order: i }));
  spots = spots.map((s, i) => Object.assign({}, s, { sort_order: i }));
  try{
    await Promise.all(snapshot.map(s =>
      fetch(SUPABASE_URL + '/rest/v1/spots?id=eq.' + encodeURIComponent(s.id), {
        method: 'PATCH',
        headers: supabaseHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify({ sort_order: s.sort_order })
      })
    ));
  }catch(e){
    console.error('Failed to save the new order', e);
  }
}

function renderMap(){
  markerLayer.clearLayers();
  const visible = getFilteredSpots();
  visible.forEach(s=>{
    if(s.lat == null || s.lng == null) return;
    const marker = L.marker([s.lat, s.lng], { icon: cocoaIcon });
    marker.bindPopup(`
      <div class="popup-name">${escapeHtml(s.name)}</div>
      <div class="popup-loc">📍 ${escapeHtml(s.location)}</div>
      ${renderBeans(s.rating, 14)}
      <div class="popup-notes">${escapeHtml(s.notes || '')}</div>
    `);
    marker.addTo(markerLayer);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

async function loadSpots(){
  loadErrorEl.style.display = 'none';
  try{
    if(SUPABASE_URL.indexOf('YOUR_SUPABASE') === 0){
      throw new Error('This site is not connected to a database yet — see the setup comment at the top of the script.');
    }
    const res = await fetch(SUPABASE_URL + '/rest/v1/spots?select=*&order=sort_order.asc.nullslast,created_at.desc', {
      headers: supabaseHeaders()
    });
    if(!res.ok) throw new Error('Failed to load spots (status ' + res.status + ').');
    spots = await res.json();
  }catch(e){
    console.error('Failed to load spots', e);
    spots = [];
    loadErrorEl.textContent = e.message || 'Could not load spots right now.';
    loadErrorEl.style.display = 'block';
  }
  loadingEl.style.display = 'none';
  renderList();
  renderMap();
  fitMapToSpots();
}

function refreshVisible(){
  renderList();
  renderMap();
  fitMapToSpots();
}
sortSelect.addEventListener('change', refreshVisible);
locationSelect.addEventListener('change', refreshVisible);

function fitMapToSpots(){
  const withCoords = getFilteredSpots().filter(s => s.lat != null && s.lng != null);
  if(!withCoords.length) return;
  const bounds = L.latLngBounds(withCoords.map(s => [s.lat, s.lng]));
  if(withCoords.length === 1){
    worldMap.setView(bounds.getCenter(), 12);
  } else {
    worldMap.fitBounds(bounds, { padding: [40,40], maxZoom: 12 });
  }
}

let pendingDeleteId = null;

function openEditModal(id){
  const spot = spots.find(s => s.id === id);
  if(!spot) return;
  editingId = id;
  document.getElementById('fName').value = spot.name;
  document.getElementById('fLoc').value = spot.location;
  document.getElementById('fNotes').value = spot.notes || '';
  document.getElementById('fPass').value = '';
  currentRating = spot.rating || 0;
  buildRateRow();
  pendingPin = { lat: spot.lat, lng: spot.lng, label: spot.location };
  formMsg.textContent = '';
  if(spot.lat != null && spot.lng != null){
    locateStatus.textContent = 'Using existing location: ' + spot.location;
    locateStatus.className = 'locate-status ok';
    miniMap.style.display = 'block';
    ensurePreviewMap();
    setTimeout(()=>{
      previewMap.invalidateSize();
      previewMap.setView([spot.lat, spot.lng], 11);
      if(previewMarker) previewMap.removeLayer(previewMarker);
      previewMarker = L.marker([spot.lat, spot.lng], { icon: cocoaIcon, draggable: true }).addTo(previewMap);
      previewMarker.on('dragend', ()=>{
        const p = previewMarker.getLatLng();
        pendingPin.lat = p.lat; pendingPin.lng = p.lng;
      });
    }, 50);
  } else {
    locateStatus.textContent = '';
    locateStatus.className = 'locate-status';
    miniMap.style.display = 'none';
  }
  document.getElementById('modalTitle').textContent = 'Edit this spot';
  saveAdd.textContent = 'Save changes';
  overlay.classList.add('open');
}

function openDeleteModal(id){
  const spot = spots.find(s => s.id === id);
  if(!spot) return;
  pendingDeleteId = id;
  document.getElementById('deleteSpotName').textContent = `"${spot.name}" — ${spot.location}`;
  document.getElementById('delPass').value = '';
  document.getElementById('deleteMsg').textContent = '';
  deleteOverlay.classList.add('open');
}

async function confirmRemoveSpot(){
  const entered = document.getElementById('delPass').value;
  const deleteMsg = document.getElementById('deleteMsg');
  if(entered !== PASSCODE){
    deleteMsg.textContent = 'Incorrect passcode.';
    return;
  }
  const id = pendingDeleteId;
  confirmDelete.disabled = true;
  deleteMsg.textContent = 'Removing…';
  try{
    const res = await fetch(SUPABASE_URL + '/rest/v1/spots?id=eq.' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: supabaseHeaders()
    });
    if(!res.ok) throw new Error('Server rejected the delete (status ' + res.status + ').');
    spots = spots.filter(s => s.id !== id);
    renderList();
    renderMap();
    deleteOverlay.classList.remove('open');
  }catch(e){
    console.error('Remove spot failed:', e);
    deleteMsg.textContent = 'Could not remove this spot. Please try again.';
  }
  confirmDelete.disabled = false;
}

// View toggle
const btnList = document.getElementById('btnList');
const btnMap = document.getElementById('btnMap');
btnList.addEventListener('click', ()=>{
  btnList.classList.add('active'); btnMap.classList.remove('active');
  listView.style.display='grid'; mapView.style.display='none';
});
btnMap.addEventListener('click', ()=>{
  btnMap.classList.add('active'); btnList.classList.remove('active');
  listView.style.display='none'; mapView.style.display='block';
  setTimeout(()=>{
    worldMap.invalidateSize();
    fitMapToSpots();
  }, 50);
});

// Rating picker in modal
const rateRow = document.getElementById('rateRow');
function buildRateRow(){
  rateRow.innerHTML = '';
  for(let i=1;i<=5;i++){
    const b = document.createElement('button');
    b.type='button';
    b.innerHTML = BEAN_SVG(i<=currentRating);
    b.addEventListener('click', ()=>{ currentRating = i; buildRateRow(); });
    rateRow.appendChild(b);
  }
}
buildRateRow();

// Locate button: geocode the typed location and preview it on a small map
const btnLocate = document.getElementById('btnLocate');
const locateStatus = document.getElementById('locateStatus');
const miniMap = document.getElementById('miniMap');

btnLocate.addEventListener('click', async ()=>{
  const name = document.getElementById('fName').value.trim();
  const loc = document.getElementById('fLoc').value.trim();
  if(!loc){
    locateStatus.textContent = 'Type a location first.';
    locateStatus.className = 'locate-status err';
    return;
  }
  btnLocate.disabled = true;
  locateStatus.textContent = 'Locating…';
  locateStatus.className = 'locate-status';
  try{
    const query = name ? `${name}, ${loc}` : loc;
    const result = await geocodeLocation(query);
    pendingPin = { lat: result.lat, lng: result.lng, label: result.label || loc };
    locateStatus.textContent = 'Found: ' + pendingPin.label;
    locateStatus.className = 'locate-status ok';
    miniMap.style.display = 'block';
    ensurePreviewMap();
    setTimeout(()=>{
      previewMap.invalidateSize();
      previewMap.setView([pendingPin.lat, pendingPin.lng], 11);
      if(previewMarker) previewMap.removeLayer(previewMarker);
      previewMarker = L.marker([pendingPin.lat, pendingPin.lng], { icon: cocoaIcon, draggable: true }).addTo(previewMap);
      previewMarker.on('dragend', ()=>{
        const p = previewMarker.getLatLng();
        pendingPin.lat = p.lat; pendingPin.lng = p.lng;
      });
    }, 50);
  }catch(e){
    console.error('Geocoding failed:', e);
    pendingPin = null;
    miniMap.style.display = 'none';
    locateStatus.textContent = "Couldn't find that location. Try adding a city/state, or drag the pin once found.";
    locateStatus.className = 'locate-status err';
  }
  btnLocate.disabled = false;
});

// Modal open/close
const overlay = document.getElementById('overlay');
const openAdd = document.getElementById('openAdd');
const cancelAdd = document.getElementById('cancelAdd');
const saveAdd = document.getElementById('saveAdd');
const formMsg = document.getElementById('formMsg');

function resetForm(){
  editingId = null;
  document.getElementById('fName').value='';
  document.getElementById('fLoc').value='';
  document.getElementById('fNotes').value='';
  document.getElementById('fPass').value='';
  currentRating = 0; buildRateRow();
  pendingPin = null;
  miniMap.style.display='none';
  locateStatus.textContent=''; locateStatus.className='locate-status';
  formMsg.textContent='';
  document.getElementById('modalTitle').textContent = 'Add a hot cocoa spot';
  saveAdd.textContent = 'Save spot';
}

openAdd.addEventListener('click', ()=>{ resetForm(); overlay.classList.add('open'); });
cancelAdd.addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.classList.remove('open'); });

// Delete modal wiring
const deleteOverlay = document.getElementById('deleteOverlay');
const cancelDelete = document.getElementById('cancelDelete');
const confirmDelete = document.getElementById('confirmDelete');
cancelDelete.addEventListener('click', ()=> deleteOverlay.classList.remove('open'));
deleteOverlay.addEventListener('click', (e)=>{ if(e.target===deleteOverlay) deleteOverlay.classList.remove('open'); });
confirmDelete.addEventListener('click', confirmRemoveSpot);

const PASSCODE = "1234567";

saveAdd.addEventListener('click', async ()=>{
  const name = document.getElementById('fName').value.trim();
  const location = document.getElementById('fLoc').value.trim();
  const notes = document.getElementById('fNotes').value.trim();

  if(!name || !location){
    formMsg.textContent = 'Please add at least a name and location.';
    return;
  }

  if(!pendingPin){
    formMsg.textContent = 'Tap Locate to find this spot on the map first.';
    return;
  }

  const enteredPass = document.getElementById('fPass').value;
  if(enteredPass !== PASSCODE){
    formMsg.textContent = 'Incorrect passcode.';
    return;
  }

  const isEditing = editingId != null;

  saveAdd.disabled = true;
  formMsg.textContent = isEditing ? 'Saving changes…' : 'Saving…';
  try{
    if(isEditing){
      const updates = {
        name, location, notes,
        rating: currentRating,
        lat: pendingPin.lat,
        lng: pendingPin.lng
      };
      const res = await fetch(SUPABASE_URL + '/rest/v1/spots?id=eq.' + encodeURIComponent(editingId), {
        method: 'PATCH',
        headers: supabaseHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify(updates)
      });
      if(!res.ok){
        const errText = await res.text().catch(()=> '');
        throw new Error('Server rejected the update (status ' + res.status + '). ' + errText);
      }
      spots = spots.map(s => s.id === editingId ? Object.assign({}, s, updates) : s);
    } else {
      const spot = {
        id: 'spot_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        name, location, notes,
        rating: currentRating,
        lat: pendingPin.lat,
        lng: pendingPin.lng,
        created_at: Date.now()
      };
      const res = await fetch(SUPABASE_URL + '/rest/v1/spots', {
        method: 'POST',
        headers: supabaseHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify(spot)
      });
      if(!res.ok){
        const errText = await res.text().catch(()=> '');
        throw new Error('Server rejected the save (status ' + res.status + '). ' + errText);
      }
      spots.unshift(spot);
    }
    renderList();
    renderMap();
    overlay.classList.remove('open');
  }catch(e){
    console.error('Save spot failed:', e);
    formMsg.textContent = 'Save failed: ' + (e && e.message ? e.message : 'unknown error') + ' (check browser console for details)';
  }
  saveAdd.disabled = false;
});

loadSpots();
</script>
